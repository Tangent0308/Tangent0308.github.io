name: Deploy website to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  config:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    outputs:
      deploy-host: ${{ steps.check.outputs.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: hugoblox.yaml
          sparse-checkout-cone-mode: false

      - name: Check deploy host
        id: check
        run: |
          YQ_VERSION="v4.44.1"
          if ! wget -q --tries=3 --waitretry=1 -O /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"; then
            echo "::error::Failed to download yq"
            exit 1
          fi
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          HOST=$(yq '.deploy.host // ""' hugoblox.yaml 2>/dev/null | grep -v '^null$' || true)
          HOST=${HOST:-github-pages}
          if [[ ! "$HOST" =~ ^(github-pages|netlify|vercel|cloudflare|none)$ ]]; then
            echo "::warning::Unknown deploy host '$HOST', defaulting to github-pages"
            HOST="github-pages"
          fi
          echo "host=$HOST" >> $GITHUB_OUTPUT

  build:
    needs: config
    if: github.repository_owner != 'HugoBlox'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    needs: [config, build]
    if: needs.config.outputs.deploy-host == 'github-pages'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
